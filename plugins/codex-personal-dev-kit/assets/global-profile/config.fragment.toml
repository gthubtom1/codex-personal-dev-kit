# Review this fragment before merging it into ~/.codex/config.toml.
# The installer intentionally does not edit config.toml automatically.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
interrupt_message = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

[features]
goals = true
hooks = true
multi_agent = true
